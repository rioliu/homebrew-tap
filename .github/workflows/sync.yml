# Keep formulae in sync with the latest GitHub releases of the tools.
# Runs daily (and on demand); commits only when a formula actually changed.

name: Sync formulae

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bump formulae to latest releases
        run: |
          # one line per tool: <tool> [<owner/repo>]
          ./scripts/bump.sh dbq

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "formulae already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "bump formulae to latest releases"
          git push
